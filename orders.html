<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفضل يا بوحمد، القائمة جاهزة</title>
    <meta name="theme-color" content="#764ba2">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            align-self: flex-start;
        }
        h1 { text-align: center; color: #764ba2; margin-bottom: 20px; font-size: 24px; }
        .input-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: nowrap; }
        .input-row input[type="text"] {
            flex: 1; min-width: 0; padding: 15px 10px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        .input-row input:focus { border-color: #764ba2; }
        .qty-input {
            width: 52px; padding: 15px 4px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; text-align: center; outline: none;
        }
        .qty-input:focus { border-color: #764ba2; }
        .unit-btns { display: flex; gap: 4px; }
        .unit-btn {
            padding: 15px 8px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 13px; background: #fff; color: #555; cursor: pointer; font-weight: bold;
            white-space: nowrap;
        }
        .unit-btn.active { background: #764ba2; border-color: #764ba2; color: #fff; }
        .btn {
            padding: 15px 14px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 15px; color: #fff; transition: 0.2s;
        }
        .btn-add { background: #764ba2; white-space: nowrap; font-weight: bold; }
        .btn-add:hover { background: #667eea; }
        .action-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .btn-action {
            flex: 1; min-width: 130px; padding: 9px 6px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .btn-clear { background: #e74c3c; color: #fff; }
        .btn-clear:hover { background: #c0392b; }
        .btn-copy { background: #764ba2; color: #fff; }
        .btn-copy:hover { background: #667eea; }
        .btn-import { background: #27ae60; color: #fff; }
        .btn-import:hover { background: #1e8449; }
        .filters { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-btn {
            flex: 1; padding: 8px; border: none; border-radius: 8px;
            cursor: pointer; background: #f0f0f0; color: #555; font-size: 14px;
        }
        .filter-btn.active { background: #764ba2; color: #fff; }
        .group-title {
            display: flex; align-items: center; gap: 8px;
            margin: 14px 0 6px; font-size: 14px; font-weight: bold; color: #fff;
            padding: 7px 12px; border-radius: 8px;
        }
        ul { list-style: none; }
        li {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 12px; border-bottom: 1px solid #f0f0f0; font-size: 16px;
        }
        li:last-child { border-bottom: none; }
        li input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
        li .task-text { flex: 1; word-break: break-word; }
        .qty-badge {
            background: #f0f0f0; color: #555; border-radius: 12px;
            padding: 3px 10px; font-size: 13px; white-space: nowrap;
        }
        li.done .task-text { text-decoration: line-through; color: #999; }
        .delete-btn {
            background: #e74c3c; border: none; color: #fff;
            border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; flex-shrink: 0;
        }
        .delete-btn:hover { background: #c0392b; }
        .category-tag {
            padding: 3px 8px; border-radius: 12px; color: #fff;
            font-size: 11px; white-space: nowrap; flex-shrink: 0;
        }
        .stats { text-align: center; margin-top: 15px; color: #888; font-size: 14px; }
        .empty { text-align: center; color: #aaa; padding: 20px; }
        #codeOverlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        #codeOverlay .code-box {
            background: #fff; border-radius: 16px; padding: 24px; width: 85%; max-width: 320px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        #codeOverlay h2 { color: #764ba2; font-size: 20px; margin-bottom: 8px; }
        #codeOverlay p { color: #888; font-size: 14px; margin-bottom: 14px; }
        #codeOverlay input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 18px; text-align: center; outline: none; margin-bottom: 12px; box-sizing: border-box;
        }
        #codeOverlay input:focus { border-color: #764ba2; }
        #codeOverlay .err { color: #e74c3c; font-size: 13px; margin-bottom: 8px; display: none; }
        .badge { font-size: 11px; color: #999; text-align: left; }
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .btn { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تفضل يا بوحمد، القائمة جاهزة</h1>
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="اكتب..." />
            <input type="number" id="qtyInput" class="qty-input" placeholder="كمية" min="0" step="any" />
            <div class="unit-btns">
                <button type="button" class="unit-btn active" data-unit="عدد" onclick="setUnit('عدد', this)">عدد</button>
                <button type="button" class="unit-btn" data-unit="كيلو" onclick="setUnit('كيلو', this)">كيلو</button>
            </div>
            <button class="btn btn-add" onclick="addTask()">إضافة</button>
        </div>
        <div class="action-row">
            <button class="btn-action btn-clear" onclick="clearDone()">🗑️ مسح السلة</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="active" onclick="setFilter('active')">قائمة التسوق</button>
            <button class="filter-btn" data-filter="done" onclick="setFilter('done')">عربة التسوق</button>
        </div>
        <div id="taskList"></div>
        <div class="stats" id="stats"></div>
    </div>

    <div id="codeOverlay">
        <div class="code-box">
            <h2>🔒 دخول العائلة</h2>
            <p>سجّل بحساب العائلة عشان تفتح القائمة المشتركة</p>
            <input type="email" id="famEmail" placeholder="البريد الإلكتروني" value="hatem@family.com" />
            <input type="password" id="famPass" placeholder="كلمة المرور" />
            <div class="err" id="codeErr">البريد أو كلمة المرور غير صحيحة</div>
            <button class="btn btn-add" style="width:100%" onclick="submitCode()">دخول</button>
        </div>
    </div>

    <script>
        const FB_API_KEY = 'AIzaSyBNQfKafqgRqmIfPPvXCDMc0V1tJ2w_RgE';
        const DB_URL = 'https://family-apps-e0076-default-rtdb.asia-southeast1.firebasedatabase.app/';

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'active';
        let syncing = false;
        let selectedUnit = 'عدد';

        function setUnit(unit, btn) {
            selectedUnit = unit;
            document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('active', b === btn));
        }

        const overlay = document.getElementById('codeOverlay');

        function getToken() {
            return new Promise((resolve, reject) => {
                const auth = JSON.parse(localStorage.getItem('famAuth') || 'null');
                if (!auth || !auth.refreshToken) { reject('noauth'); return; }
                if (auth.expiresAt && Date.now() < auth.expiresAt) { resolve(auth.idToken); return; }
                fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ grant_type: 'refresh_token', refresh_token: auth.refreshToken })
                }).then(r => r.json()).then(d => {
                    if (d.id_token) {
                        const updated = {
                            refreshToken: d.refresh_token || auth.refreshToken,
                            idToken: d.id_token,
                            expiresAt: Date.now() + parseInt(d.expires_in || 3600) * 1000 - 60000
                        };
                        localStorage.setItem('famAuth', JSON.stringify(updated));
                        resolve(d.id_token);
                    } else { reject('refreshfail'); }
                }).catch(() => reject('refreshfail'));
            });
        }

        function showLogin() {
            overlay.style.display = 'flex';
        }

        function submitCode() {
            const email = document.getElementById('famEmail').value.trim();
            const pass = document.getElementById('famPass').value;
            fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FB_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass, returnSecureToken: true })
            }).then(r => r.json()).then(d => {
                if (d.idToken) {
                    localStorage.setItem('famAuth', JSON.stringify({
                        refreshToken: d.refreshToken,
                        idToken: d.idToken,
                        expiresAt: Date.now() + parseInt(d.expiresIn || 3600) * 1000 - 60000
                    }));
                    overlay.style.display = 'none';
                    pullCloud();
                } else {
                    document.getElementById('codeErr').style.display = 'block';
                }
            }).catch(() => {
                document.getElementById('codeErr').style.display = 'block';
            });
        }

        document.getElementById('famPass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitCode();
        });

        function pushCloud() {
            if (syncing) return;
            getToken().then(t => {
                fetch(DB_URL + 'tasks.json?auth=' + encodeURIComponent(t), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tasks)
                }).then(r => { if (r.status === 401) showLogin(); });
            }).catch(() => showLogin());
        }

        function pullCloud() {
            if (syncing) return;
            syncing = true;
            getToken().then(t => {
                fetch(DB_URL + 'tasks.json?auth=' + encodeURIComponent(t))
                    .then(r => {
                        if (r.status === 401) { showLogin(); return null; }
                        return r.json();
                    })
                    .then(remote => {
                        if (remote && Array.isArray(remote)) {
                            tasks = remote;
                            localStorage.setItem('tasks', JSON.stringify(tasks));
                            render();
                        }
                    })
                    .catch(() => {})
                    .finally(() => { syncing = false; });
            }).catch(() => { syncing = false; showLogin(); });
        }

const categoryKeywords = {
            'بهارات': ['ملح', 'فلفل أسود', 'فلفل اسود', 'كمون', 'كركم', 'كزبرة', 'قرفة', 'هيل', 'زعفران', 'بهارات', 'ماجي', 'كاري', 'زنجبيل', 'بابريكا', 'شطة', 'حب', 'حب هيل', 'عصفر'],
            'فواكه وخضروات': ['طماطم', 'برتقال', 'تفاح', 'موز', 'عنب', 'فراولة', 'بطيخ', 'خوخ', 'تمر', 'ليمون', 'مانجو', 'رمان', 'بصل', 'خيار', 'باذنجان', 'جزر', 'بطاطس', 'كوسة', 'فلفل', 'خس', 'سبانخ', 'ملفوف', 'ثوم', 'زنجبيل'],
            'مثلجات': ['نكت', 'مثلج', 'أيس كريم', 'بوظة', 'آيسكريم', 'الايس'],
            'ألبان': ['حليب', 'جبن', 'زبادي', 'لبن', 'روب', 'زبد', 'زبدة', 'كريمة'],
            'مخبوزات': ['خبز', 'توست', 'كعك', 'بسكويت', 'كرواسون', 'فطيرة', 'بيتزا', 'كيك'],
            'لحوم': ['لحم', 'دجاج', 'كبسة', 'ستيك', 'برجر', 'سمك', 'روبيان', 'تونة'],
            'مشروبات': ['ماء', 'عصير', 'شاي', 'قهوة', 'كولا', 'بيبسي', 'شعير', 'سفن', 'ميرندا', 'حليب', 'موية', 'مياه', 'ميلك', 'كوكتيل', 'سبرايت', 'بوب', 'ريد بول', 'سبا', 'هوت', 'نسكافيه', 'انستا', 'مشروب'],
            'منظفات': ['صابون', 'شامبو', 'مسحوق', 'كلور', 'ديتول', 'معطر'],
            'أساسيات': ['رز', 'سكر', 'زيت', 'دقيق', 'معكرونة', 'شعيرية', 'عدس', 'حمص']
        };

        function categorize(text) {
            const normalized = normalizeArabic(text);
            let bestCategory = 'عام';
            let maxScore = 0;
            for (const [category, keywords] of Object.entries(categoryKeywords)) {
                let score = 0;
                keywords.forEach(kw => {
                    if (normalized.includes(normalizeArabic(kw))) score++;
                });
                if (score > maxScore) {
                    maxScore = score;
                    bestCategory = category;
                }
            }
            return bestCategory;
        }

        function normalizeArabic(s) {
            return s.toLowerCase()
                .replace(/[\u064B-\u0652\u0640]/g, '')
                .replace(/[أإآ]/g, 'ا')
                .replace(/ى/g, 'ي');
        }

        const categoryColors = {
            'فواكه وخضروات': '#27ae60',
            'مثلجات': '#3498db',
            'ألبان': '#f39c12',
            'مخبوزات': '#8e44ad',
            'لحوم': '#c0392b',
            'مشروبات': '#2980b9',
            'منظفات': '#16a085',
            'بهارات': '#e67e22',
            'أساسيات': '#7f8c8d',
            'عام': '#555'
        };

        function save() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            render();
            pushCloud();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (text) {
                const category = categorize(text);
                const qty = parseFloat(document.getElementById('qtyInput').value);
                const unit = selectedUnit;
                tasks.push({ id: Date.now(), text: text, done: false, category: category, qty: isNaN(qty) ? null : qty, unit: unit });
                input.value = '';
                document.getElementById('qtyInput').value = '';
                save();
            }
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; save(); }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === filter);
            });
            render();
        }

        function render() {
            const list = document.getElementById('taskList');
            let filtered = tasks;
            if (currentFilter === 'active') filtered = tasks.filter(t => !t.done);
            if (currentFilter === 'done') filtered = tasks.filter(t => t.done);

            if (filtered.length === 0) {
                list.innerHTML = '<li class="empty">لا توجد مهام هنا</li>';
            } else {
                list.innerHTML = '';
                const groups = {};
                filtered.forEach(t => {
                    if (!groups[t.category]) groups[t.category] = [];
                    groups[t.category].push(t);
                });
                Object.entries(groups).forEach(([category, items]) => {
                    const color = categoryColors[category] || '#555';
                    const title = document.createElement('div');
                    title.className = 'group-title';
                    title.style.background = color;
                    title.textContent = `${category} (${items.length})`;
                    list.appendChild(title);
                    items.forEach(t => {
                        const li = document.createElement('li');
                        li.className = t.done ? 'done' : '';
                        const qtyBadge = (t.qty != null)
                            ? `<span class="qty-badge">${t.qty} ${t.unit || ''}</span>`
                            : '';
                        li.innerHTML = `
                            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})" />
                            <span class="task-text">${escapeHtml(t.text)}</span>
                            ${qtyBadge}
                            <span class="category-tag" style="background:${color}">${escapeHtml(t.category)}</span>
                            <button class="delete-btn" onclick="deleteTask(${t.id})">حذف</button>
                        `;
                        list.appendChild(li);
                    });
                });
            }

            const done = tasks.filter(t => t.done).length;
            document.getElementById('stats').textContent =
                `${tasks.length} مهمة | ${done} مكتملة | ${tasks.length - done} ناقصة`;
        }

        function clearDone() {
            if (tasks.length === 0) { alert('لا توجد مهام لمسحها'); return; }
            const done = tasks.filter(t => t.done).length;
            if (done === 0) { alert('لا توجد مهام مكتملة لمسحها'); return; }
            if (confirm(`هل أنت متأكد من مسح ${done} مكتملة؟`)) {
                tasks = tasks.filter(t => !t.done);
                save();
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('taskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        setInterval(pullCloud, 3000);
        const auth = JSON.parse(localStorage.getItem('famAuth') || 'null');
        if (auth && auth.refreshToken) { overlay.style.display = 'none'; pullCloud(); }
        else { showLogin(); }
        render();
    </script>
</body>
</html>
